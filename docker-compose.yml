name: payments-backend

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/payments
      DEMO_MODE: "true"
      PROCESSING_DELAY_MS: "150"   # makes races easy to see in the demo; use 0 in production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
