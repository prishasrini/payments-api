# Render Blueprint: render.com -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: payments-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL        # paste your Neon connection string when Render asks
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: PROCESSING_DELAY_MS # makes race conditions visible in the demo; 0 in production
        value: "150"
      - key: CORS_ORIGINS
        value: "*"
      - key: DB_POOL_SIZE
        value: "5"
